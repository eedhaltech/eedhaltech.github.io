    <rect x="155" y="147" width="25" height="25" rx="2" transform="rotate(9 167 159)"/>
    <rect x="188" y="112" width="11" height="11" rx="2"/>
    <rect x="72" y="238" width="28" height="28" rx="2" transform="rotate(9 86 252)"/>
