<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12B7E8"/>
      <stop offset="100%" stop-color="#1472F4"/>
    </linearGradient>
    <linearGradient id="deepBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B6DB8"/>
      <stop offset="100%" stop-color="#123D91"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123D78"/>
      <stop offset="100%" stop-color="#071F4E"/>
